name: sync-yt-dlp-master

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.pin.outputs.changed }}
      rev: ${{ steps.pin.outputs.rev }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update pin
        id: pin
        uses: ./.github/actions/update-pin

      - uses: actions/upload-artifact@v4
        if: steps.pin.outputs.changed == 'true'
        with:
          name: pin
          path: pin.json

  build-push:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pin

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and push
        uses: ./.github/actions/build-push
        with:
          endpoint: https://attic.cloud.dmytros.dev
          cache: cache
          token: ${{ secrets.ATTIC_TOKEN }}

  commit:
    needs: [update, build-push]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pin

      - name: Commit pin
        uses: ./.github/actions/commit-pin
        with:
          version: ${{ needs.update.outputs.version }}
          rev: ${{ needs.update.outputs.rev }}

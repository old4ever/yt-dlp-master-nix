name: sync-yt-dlp-master

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bound runaway cost; a normal run is ~1 minute.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Update pin
        id: pin
        uses: ./.github/actions/update-pin

      - name: Build and push
        if: steps.pin.outputs.changed == 'true'
        uses: ./.github/actions/build-push
        with:
          endpoint: https://attic.cloud.dmytros.dev
          cache: cache
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Commit pin
        if: steps.pin.outputs.changed == 'true'
        uses: ./.github/actions/commit-pin
        with:
          version: ${{ steps.pin.outputs.version }}
          rev: ${{ steps.pin.outputs.rev }}
